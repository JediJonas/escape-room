name: Kontroll

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Varningarna stoppar inte än, eftersom den gamla koden har tal utan
      # namn. De blir fel när koden är städad.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run validate:html

  # Serverfunktionen körs i Deno hos Supabase. Deno provar typerna med
  # bibliotekens riktiga typer, som tsc i Node inte kan hämta.
  function:
    name: Serverfunktionen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check index.ts
        working-directory: supabase/functions/game

  # Provar migreringarna, kanalernas regler och serverfunktionens SQL i en
  # vanlig Postgres, med det minsta av Supabase efterliknat i
  # supabase/tests/supabase-stubs.sql.
  database:
    name: Databasens regler
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:db
