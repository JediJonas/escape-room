name: Lägg ut Supabase

# Lägger ut databasens migreringar och spelets serverfunktion när main ändras.
# Kräver hemligheterna SUPABASE_ACCESS_TOKEN och SUPABASE_DB_PASSWORD.
on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/supabase.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      # Projektets id står också i adressen i src/config.js. Det är inte hemligt.
      SUPABASE_PROJECT_ID: zmgdbcimabemafuhioji
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # En fast version, så att en ny CLI inte ändrar flaggorna mitt i
          # en utläggning. Höjs för hand.
          version: 3.2.0
      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      # --remote behövs, annars försöker CLI:n nå en lokal databas.
      - run: supabase db push --yes --remote
      # --yes behövs, annars väntar CLI:n på en bekräftelse som aldrig kommer.
      - run: supabase functions deploy game --remote="$SUPABASE_PROJECT_ID" --use-api --yes
