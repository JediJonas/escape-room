<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 710" font-family="Georgia, serif">
<rect width="900" height="710" fill="#f4ecdc"/>
<text x="450" y="40" text-anchor="middle" font-size="26" fill="#2b2118">Den femte gästen – planlösning</text>
<!-- bottenvåning -->
<text x="40" y="78" font-size="16" fill="#6b5a45">BOTTENVÅNING</text>
<g stroke="#2b2118" stroke-width="6" fill="none">
  <rect x="40" y="90" width="560" height="420"/>
  <line x1="220" y1="90" x2="220" y2="510"/>
  <line x1="420" y1="90" x2="420" y2="372"/>
  <line x1="220" y1="372" x2="600" y2="372"/>
  <line x1="490" y1="372" x2="490" y2="510"/>
</g>
<g stroke="#f4ecdc" stroke-width="8">
  <line x1="362" y1="372" x2="412" y2="372"/>
  <line x1="220" y1="447" x2="220" y2="497"/>
  <line x1="430" y1="372" x2="480" y2="372"/>
  <line x1="490" y1="447" x2="490" y2="497"/>
  <line x1="220" y1="98" x2="220" y2="148"/>
  <line x1="420" y1="98" x2="420" y2="148"/>
  <line x1="290" y1="510" x2="350" y2="510"/>
</g>
<g stroke="#2b2118" stroke-width="2" fill="none">
  <path d="M362 372 A50 50 0 0 1 412 322"/><line x1="412" y1="372" x2="412" y2="322"/>
  <path d="M170 497 A50 50 0 0 1 220 447"/><line x1="220" y1="497" x2="170" y2="497"/>
  <path d="M430 322 A50 50 0 0 1 480 372"/><line x1="430" y1="372" x2="430" y2="322"/>
</g>

<!-- pianot -->
<g>
  <rect x="238" y="376" width="84" height="26" fill="#3a2c20"/>
  <rect x="242" y="396" width="76" height="6" fill="#f4ecdc"/>
  <text x="280" y="393" text-anchor="middle" font-size="11" fill="#f4ecdc">pianot</text>
</g>
<!-- källardörren -->
<path d="M490 447 A50 50 0 0 0 440 497" stroke="#2b2118" stroke-width="2" fill="none"/>
<line x1="490" y1="497" x2="440" y2="497" stroke="#2b2118" stroke-width="2"/>
<text x="432" y="492" text-anchor="end" font-size="11" fill="#2b2118">källardörren 🔒</text>
<!-- källartrappan: en vinkeltrappa som börjar längst ner och svänger uppåt i hörnet, upp till köksväggen -->
<g fill="#e6d9bf" stroke="#2b2118" stroke-width="1.5">
  <rect x="496" y="464" width="54" height="40"/>
  <rect x="550" y="464" width="44" height="40"/>
  <rect x="550" y="378" width="44" height="86"/>
</g>
<g stroke="#2b2118" stroke-width="1.5">
  <line x1="507" y1="464" x2="507" y2="504"/><line x1="518" y1="464" x2="518" y2="504"/><line x1="529" y1="464" x2="529" y2="504"/><line x1="540" y1="464" x2="540" y2="504"/>
  <line x1="550" y1="452" x2="594" y2="452"/><line x1="550" y1="440" x2="594" y2="440"/><line x1="550" y1="428" x2="594" y2="428"/><line x1="550" y1="416" x2="594" y2="416"/><line x1="550" y1="404" x2="594" y2="404"/><line x1="550" y1="392" x2="594" y2="392"/>
</g>
<path d="M500 484 H572 V386" stroke="#2b2118" stroke-width="1.5" fill="none"/>
<path d="M567 392 L572 384 L577 392" stroke="#2b2118" stroke-width="1.5" fill="none"/>
<g font-size="10" fill="#2b2118" text-anchor="middle"><text x="522" y="430">källar-</text><text x="522" y="443">trappan ned</text></g>
<!-- dörrarna från salongen till sovrummet och köket (Jonas 2026-11-20) -->
<g stroke="#2b2118" stroke-width="2" fill="none">
  <path d="M220 98 A50 50 0 0 0 170 148"/><line x1="220" y1="148" x2="170" y2="148"/>
  <path d="M420 98 A50 50 0 0 1 470 148"/><line x1="420" y1="148" x2="470" y2="148"/>
</g>
<g font-size="22" fill="#2b2118" text-anchor="middle">
  <text x="130" y="290">Sovrummet</text>
  <text x="320" y="200">Salongen</text>
  <text x="510" y="200">Köket</text>
  <text x="320" y="430" font-weight="bold">Hallen</text>
</g>
<g font-size="13" fill="#6b5a45" text-anchor="middle">
  <text x="130" y="312">byrån med urklippen</text>
  <text x="130" y="330">nyckeln, ritningen</text>
  <text x="320" y="222">ouijabrädet, golvuret</text>
  <text x="510" y="222">tavlan, proppskåpet</text>
  <text x="320" y="450">gästboken</text>
</g>
<text x="320" y="540" text-anchor="middle" font-size="14" fill="#2b2118">↑ ytterdörr – spelet börjar här</text>
<!-- källare -->
<text x="650" y="78" font-size="16" fill="#6b5a45">KÄLLARE</text>
<g stroke="#2b2118" stroke-width="5" fill="none"><rect x="650" y="90" width="210" height="178"/></g>
<line x1="790" y1="90" x2="790" y2="268" stroke="#2b2118" stroke-width="5" stroke-dasharray="10 6"/>
<text x="720" y="178" text-anchor="middle" font-size="20" fill="#2b2118">Källaren</text>
<text x="720" y="118" text-anchor="middle" font-size="12" fill="#2b2118">trappa upp till hallen</text>
<text x="720" y="198" text-anchor="middle" font-size="12" fill="#6b5a45">hyllan med syltburkar</text>
<text x="825" y="173" text-anchor="middle" font-size="12" fill="#2b2118">dolda</text>
<text x="825" y="188" text-anchor="middle" font-size="12" fill="#2b2118">rummet</text>
<!-- teckenförklaring -->
<g font-size="14" fill="#2b2118">
  <path d="M60 585 A45 45 0 0 1 105 630" stroke="#2b2118" stroke-width="2" fill="none"/><line x1="60" y1="585" x2="60" y2="630" stroke="#2b2118" stroke-width="2"/>
  <text x="125" y="622">Dörr</text>
  <text x="80" y="677" text-anchor="middle" font-size="20">🔒</text>
  <text x="125" y="675">Källardörren, låst tills gruppen har nyckeln</text>
</g>
</svg>
