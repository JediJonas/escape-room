<html lang="sv">

    <meta name="color-scheme" content="light dark">

    <title>Testkort – Escape room för mobiler</title>

  <body>
    <header class="no-print">
      <h1>Testkort</h1>

      <p><a href="./">Tillbaka till testsidan</a></p>
    </header>

      <ul class="place-cards">
        <li><img src="platskort/A.svg" alt="QR-kod för plats A" width="240" height="240"><span>A</span></li>
        <li><img src="platskort/B.svg" alt="QR-kod för plats B" width="240" height="240"><span>B</span></li>

        <li><img src="platskort/E.svg" alt="QR-kod för plats E" width="240" height="240"><span>E</span></li>
        <li><img src="platskort/F.svg" alt="QR-kod för plats F" width="240" height="240"><span>F</span></li>
      </ul>
    </main>
